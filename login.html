<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="icon" href="favicon.ico">
    <link rel="stylesheet" href="style/login.css">
    <link rel="stylesheet" href="style/messages.css">
    <link rel="stylesheet" href="style/cookies.css">
    <link rel="stylesheet" href="style/password-recovery.css">
    <script src="scripts/messages.js" defer></script>
    <script src="scripts/password-toggle.js" defer></script>
    <script src="scripts/login.js" defer></script>
    <script src="scripts/password-recovery.js" defer></script>
    <script src="scripts/cookies.js" defer></script>
</head>
<body>
    <div id="login-messages" aria-live="polite"></div>
    <main>
        <h1>Login</h1>
        <form id="login-form" method="post">
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" autocomplete="username" required><br><br>
            <label for="password">Password:</label>
            <div class="password-field">
                <input type="password" id="password" name="password" autocomplete="current-password" required>
                <button class="password-toggle" type="button" aria-label="Show password" aria-controls="password" aria-pressed="false">
                    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                        <path class="eye-open" d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Zm10 4a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z"/>
                        <path class="eye-closed" d="m3 3 18 18M10.6 10.6a2 2 0 0 0 2.8 2.8M9.9 5.2A10.7 10.7 0 0 1 12 5c6.4 0 10 7 10 7a15.7 15.7 0 0 1-3.1 3.8M6.2 6.2C3.5 8 2 12 2 12s3.6 7 10 7c1.4 0 2.7-.4 3.8-1"/>
                    </svg>
                </button>
            </div><br><br>
            <input type="submit" value="Login">
        </form>
        <button id="show-password-recovery" class="recovery-link" type="button" aria-controls="password-recovery" aria-expanded="false">
            Forgot your password?
        </button>
        <section id="password-recovery" class="recovery-panel" aria-labelledby="password-recovery-heading" hidden>
            <h2 id="password-recovery-heading">Reset your password</h2>
            <p>Enter your account email to find your recovery question.</p>
            <form id="reset-email-form" method="post" novalidate>
                <label for="reset-email">Email address</label>
                <input id="reset-email" name="email" type="email" maxlength="254" autocomplete="email" required>
                <button type="submit">Continue</button>
            </form>
            <form id="reset-password-form" method="post" novalidate hidden>
                <p id="reset-recovery-question" class="recovery-question"></p>
                <input id="reset-question-id" type="hidden" name="question_id">
                <input id="reset-email-value" type="hidden" name="email">
                <label for="reset-answer">Your answer</label>
                <input id="reset-answer" name="answer" type="text" maxlength="200" autocomplete="off" required>
                <label for="reset-new-password">New password</label>
                <input id="reset-new-password" name="password" type="password" autocomplete="new-password" required>
                <label for="reset-confirm-password">Confirm new password</label>
                <input id="reset-confirm-password" name="confirm_password" type="password" autocomplete="new-password" required>
                <button type="submit">Reset password</button>
            </form>
        </section>
        <p class="login-hint">Demo account: username <code>test</code>, password <code>DemoCollege!2026</code>. This fixed account is for testing only.</p>
        <nav class="account-navigation" aria-label="Account navigation">
            <a class="back-to-products" href="products.html">Back to products</a>
            <a class="back-to-products" href="register.html">Register</a>
        </nav>
    </main>
</body>
</html>
