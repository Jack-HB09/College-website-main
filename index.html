<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="scripts/main.js"></script>

    <link rel="stylesheet" href="style/main.css">
</head>

<body>
    <nav>
        <div id="sitename">
            site
        </div>
        <div id="utility-container">
            <img id="account-svg" src="images/account.svg" alt="Account">
            <img id="hamburger-svg" src="images/hamburger.svg" alt="Menu">
        </div>
    </nav>
    <div id="hamburger-nav">
        <ul>
            <li><a href="#">home</a></li>
            <li><a href="#">contacts</a></li>
            <li><a href="#">site map</a></li>
            <li><a href="#">docs</a></li>
        </ul>
    </div>
    <main>
        <div id="main-header">
            Products
        </div>
        <div id="product-scroller">
            <div class="product-card" id="product-card-id">
                <img src="images/placeholder.svg" alt="Product Image" class="product-image">
                <div class="product-details " id="product details-id">
                    <div class="product-name">
                        Product Name
                    </div>
                    <div class="product-price">$19.99</div>
                    <div class="product-size-container">
                        <button class="product-size-container-size" value="small">S</button>
                        <button class="product-size-container-size" value="medium">M</button>
                        <button class="product-size-container-size" value="large">L</button>
                    </div>
                    <button class="add-to basket">add to basket</button>
                </div>
            </div>
        </div>

    </main>
    <footer>
        <div class="spacer">

        </div>
        <div id="footer-content">
            <div id="contact">
                <div socials-container>
                    <h1>Follow us!</h1>
                    <div id="socials">
                        <div id="instagram">
                            <a href="https://instagram.com" target="_blank" rel="noopener noreferrer">
                                <img src="images/instagram.svg" alt="Instagram">
                            </a>
                        </div>
                        <div id="tic-tok">
                            <a href="https://tiktok.com" target="_blank" rel="noopener noreferrer">
                                <img src="images/tiktok.svg" alt="Tic Tok">
                            </a>

                        </div>
                        <div id="linkedin">
                            <a href="https://linkedin.com" target="_blank" rel="noopener noreferrer">
                                <img src="images/linkedin.svg" alt="LinkedIn">
                            </a>
                        </div>
                    </div>
                </div>
                <div id="older-container">
                    <h1>contact us</h1>
                    <div id="older">
                        <div id="phone">
                            <a href="tel:+1234567890">+1 (234) 567-890</a>
                        </div>
                        <div id="email">
                            <a href="mailto:example@info.com">example@info.com</a>
                        </div>
                    </div>
                </div>
            </div>
            <div id="policies">
                <a href="#">privacy policy</a>
                <a href="#">terms of service</a>
                <a href="#">cookie policy</a>
            </div>
        </div>
        <div class="spacer">

        </div>
    </footer>
</body>

</html>
